[project]
name = "ctrl"
version = "0.1.0"
description = "Solar monitor: Daxtromn inverter, DAH battery (CAN), ZMAi-90 meter, N-PE bonding"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=1.6,<2",
    "pyserial>=3.5",
    "gpiozero>=2.0",
]

[project.optional-dependencies]
dev = [
    "tinytuya>=1.20",
    "bleak>=3.0",
]
